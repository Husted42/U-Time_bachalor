train_data:
  data_dir: /mnt/d/datasets/processed/cfs/views/fixed_split/train
  period_length: 1
  identifier: TRAIN
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids

val_data:
  data_dir: /mnt/d/datasets/processed/cfs/views/fixed_split/val
  period_length: 1
  identifier: VAL
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids

test_data:
  data_dir: /mnt/d/datasets/processed/cfs/views/fixed_split/test
  period_length: 1
  identifier: TEST
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids

set_sample_rate: 128

channel_sampling_groups: [['C3-A2', 'C4-A1'], ['LOC-A2', 'ROC-A1']]

sleep_stage_annotations:
  True: 1

strip_func:
  strip_func: strip_to_match

quality_control_func:
  quality_control_func: clip_noisy_values
  min_max_times_global_iqr: 20

scaler: RobustScaler

batch_wise_scaling: false
